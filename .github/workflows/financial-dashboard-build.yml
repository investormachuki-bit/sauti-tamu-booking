name: Financial dashboard build check

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/financials/**"
      - "app/admin/financial-obligations/**"
      - "components/admin/financial/**"
      - "lib/financial-service.ts"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/financial-dashboard-build.yml"
  push:
    branches: [feature/financial-dashboard-rebuild]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-placeholder
